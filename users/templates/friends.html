{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <h2>Управление контактами</h2>
    <a href="{% url 'main' %}" class="btn btn-secondary mb-3">Вернуться в чат</a>

    <div class="card p-3 mb-4">
        <h5>Добавить друга</h5>
        <form method="post" action="{% url 'friends_add' %}" class="d-flex gap-2">
            {% csrf_token %}
            {{ add_form.friend_username }}
            <button type="submit" class="btn btn-success">Добавить</button>
        </form>
    </div>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>Никнейм</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody>
            {% for friend in friends %}
            <tr>
                <td><a href="{% url 'user_detail' friend.username %}">{{ friend.username }}</a></td>
                <td>
                    <a href="{% url 'friends_remove' friend.id %}" class="btn btn-sm btn-warning">Удалить из списка</a>
                    <a href="{% url 'friends_delete' friend.id %}"
                    class="btn btn-sm btn-danger"
                    onclick="return confirm('Удалить ВСЮ переписку с этим пользователем? Аккаунт друга останется нетронутым.')">
                    Очистить переписку
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
