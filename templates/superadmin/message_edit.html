{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="card" style="max-width: 600px; margin: auto;">
        <div class="card-header bg-warning">
            <h4>✏️ Редактирование сообщения</h4>
        </div>
        <div class="card-body">
            <p><strong>От:</strong> {{ msg.sender.username }}</p>
            <p><strong>Дата:</strong> {{ msg.created_at|date:"d.m.Y H:i" }}</p>

            <div class="alert alert-info">
                <strong>Текущий текст:</strong><br>
                {{ msg.content }}
            </div>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Новый текст сообщения</label>
                    <textarea name="content" class="form-control" rows="4" required>{{ msg.content }}</textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label text-danger">🔐 Пароль администратора</label>
                    <input type="password" name="admin_password" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-warning w-100">Изменить сообщение</button>
            </form>
        </div>
        <div class="card-footer">
            <a href="{% url 'superadmin_panel' %}" class="btn btn-secondary">← Назад</a>
        </div>
    </div>
</div>
{% endblock %}
