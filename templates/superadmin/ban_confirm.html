{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="card border-danger" style="max-width: 500px; margin: auto;">
        <div class="card-header bg-danger text-white">
            <h4>🚫 Забанить пользователя</h4>
        </div>
        <div class="card-body">
            <p class="lead">Вы собираетесь заблокировать:</p>
            <h3>{{ target_user.username }}</h3>
            <p class="text-muted">Ник: {{ target_user.nick|default:"—" }}</p>

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Причина блокировки</label>
                    <textarea name="ban_reason" class="form-control" rows="3" required>Нарушение правил</textarea>
                    <small class="text-muted">Пользователь увидит эту причину при попытке входа</small>
                </div>

                <button type="submit" class="btn btn-danger w-100">🔒 Забанить</button>
            </form>
        </div>
        <div class="card-footer">
            <a href="{% url 'superadmin_panel' %}" class="btn btn-secondary">← Отмена</a>
        </div>
    </div>
</div>
{% endblock %}
