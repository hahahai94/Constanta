{% extends 'base.html' %}

{% block body_class %}content-page{% endblock %}
{% block container_class %}container{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="card" style="max-width: 600px; margin: auto;">
        <div class="card-header bg-primary text-white"><h4>✏️ Редактирование группы</h4></div>
        <div class="card-body">
            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="mb-3 text-center">
                    <img src="{{ group.get_avatar_url }}" class="rounded-circle mb-2" style="width: 100px; height: 100px; object-fit: cover;">
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Название группы</label>
                    <input type="text" name="name" class="form-control" value="{{ group.name }}" required>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Описание</label>
                    <textarea name="description" class="form-control" rows="3">{{ group.description }}</textarea>
                </div>
                
                <div class="mb-3">
                    <label class="form-label">Новая аватарка</label>
                    <input type="file" name="avatar" class="form-control">
                </div>
                
                <div class="mb-3">
                    <label class="form-label text-danger">🔐 Пароль администратора (подтверждение)</label>
                    <input type="password" name="admin_password" class="form-control" required>
                </div>
                
                <button type="submit" class="btn btn-success w-100">Сохранить изменения</button>
            </form>
        </div>
        <div class="card-footer">
            <a href="{% url 'superadmin_panel' %}" class="btn btn-secondary">← Назад</a>
        </div>
    </div>
</div>
{% endblock %}
