{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-4">
    <h2 class="mb-4 text-center">🔍 Все пользователи</h2>

    <!-- 🔹 ПОИСК -->
    <div class="card-modern mb-4">
        <form method="get" action="{% url 'users_catalog' %}" class="d-flex gap-2">
            <input type="text" name="q" class="form-control-modern flex-grow-1" placeholder="Поиск по имени или нику..." value="{{ query }}">
            <button type="submit" class="btn-grad grad-purple">Найти</button>
        </form>
    </div>

    <!-- 🔹 СПИСОК -->
    <div class="row g-3">
        {% for user in users %}
        <div class="col-md-6 col-lg-4">
            <div class="card-modern d-flex align-items-center p-3">
                <img src="{{ user.get_avatar_url }}" class="rounded-circle me-3" style="width: 60px; height: 60px; object-fit: cover;">
                <div class="flex-grow-1 min-width-0">
                    <h5 class="mb-1 text-truncate">{{ user.get_display_name }}</h5>
                    <small class="text-muted d-block">@{{ user.username }}</small>

                    <!-- 🔹 КНОПКА НАПИСАТЬ (ведёт на главный чат) -->
                    <a href="{% url 'main' %}?friend_id={{ user.id }}" class="btn-grad grad-blue mt-2" style="padding: 6px 12px; font-size: 13px;">💬 Написать</a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center text-muted py-5">
            <h4>Пользователи не найдены</h4>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
