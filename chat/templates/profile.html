{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card-modern">
                <!-- 🔹 Шапка профиля -->
                <div class="text-center mb-4">
                    <img src="{{ user.get_avatar_url }}" class="rounded-circle mb-3" style="width: 100px; height: 100px; object-fit: cover; border: 4px solid #f0f0f0;">
                    <h3>{{ user.get_display_name }}</h3>
                    <p class="text-muted">@{{ user.username }}</p>
                </div>

                <!-- 🔹 Форма редактирования -->
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-3">
                        <label class="form-label fw-bold">🏷️ Ник / Имя</label>
                        <input type="text" name="nick" class="form-control-modern" value="{{ user.nick|default:'' }}">
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">📧 Email</label>
                        <input type="email" name="email" class="form-control-modern" value="{{ user.email|default:'' }}">
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">🖼️ Аватарка</label>
                        <input type="file" name="avatar" class="form-control-modern" accept="image/*">
                    </div>

                    <button type="submit" class="btn-grad grad-purple w-100">💾 Сохранить изменения</button>
                </form>

                <hr class="my-4">

                <!-- 🔹 Управление аккаунтом -->
                <h5 class="text-center mb-3 text-muted">⚙️ Управление аккаунтом</h5>
                <div class="row g-3">
                    <div class="col-md-6">
                        <a href="{% url 'change_username' %}" class="btn-grad grad-blue w-100">🔤 Сменить логин</a>
                    </div>
                    <div class="col-md-6">
                        <a href="{% url 'change_password' %}" class="btn-grad grad-orange w-100">🔒 Сменить пароль</a>
                    </div>
                    <div class="col-12">
                        <button onclick="if(confirm('Вы действительно хотите выйти из системы?')) window.location.href='{% url "logout" %}'" class="btn-grad grad-red w-100">🚪 Выйти из аккаунта</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
